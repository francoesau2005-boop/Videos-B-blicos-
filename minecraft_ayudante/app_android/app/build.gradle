plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ayudante.survival'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ayudante.survival'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Llave propia para que las actualizaciones se instalen encima de la versión anterior
    signingConfigs {
        propia {
            storeFile file('ayudante.keystore')
            storePassword 'ayudante'
            keyAlias 'ayudante'
            keyPassword 'ayudante'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.propia
        }
        debug {
            signingConfig signingConfigs.propia
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
