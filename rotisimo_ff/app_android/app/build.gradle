plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rotisimo.ff'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rotisimo.ff'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '1.8'
        manifestPlaceholders = [admobAppId: project.property('ADMOB_APP_ID')]
        buildConfigField 'String', 'ADMOB_BANNER', "\"${project.property('ADMOB_BANNER')}\""
        buildConfigField 'String', 'ADMOB_RECOMPENSA', "\"${project.property('ADMOB_RECOMPENSA')}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Llave propia para que las actualizaciones se instalen encima de la versión anterior
    signingConfigs {
        propia {
            storeFile file('rotisimo.keystore')
            storePassword 'rotisimo'
            keyAlias 'rotisimo'
            keyPassword 'rotisimo'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.propia
        }
        debug {
            signingConfig signingConfigs.propia
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
}
